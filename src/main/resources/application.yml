server:
  port: ${PORT:80}
  forward-headers-strategy: native
  shutdown: graceful

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  datasource:
    # Azure auto-generated connection (primary)
    url: ${DATABASE_URL:jdbc:postgresql://${AZURE_POSTGRESQL_HOST:localhost}:${AZURE_POSTGRESQL_PORT:5432}/${AZURE_POSTGRESQL_DATABASE:myapp}?sslmode=${AZURE_POSTGRESQL_SSLMODE:require}}
    username: ${DATABASE_USERNAME:${AZURE_POSTGRESQL_USERNAME:postgres}}
    password: ${DATABASE_PASSWORD:${AZURE_POSTGRESQL_PASSWORD:password}}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:5}
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  mvc:
    static-path-pattern: /webjars/**

  lifecycle:
    timeout-per-shutdown-phase: 30s

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    org.springframework.web: INFO
    org.hibernate: WARN
    com.microsoft.applicationinsights: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# Azure App Service specific configurations
azure:
  application-insights:
    instrumentation-key: ${APPINSIGHTS_INSTRUMENTATIONKEY:}
    connection-string: ${APPLICATIONINSIGHTS_CONNECTION_STRING:}

google:
  maps:
    api:
      key: ${GOOGLE_MAPS_API_KEY}

stripe:
  api:
    secretKey: ${STRIPE_SECRET_KEY}
    publishableKey: ${STRIPE_PUBLISHABLE_KEY}
    baseUrl: "https://api.stripe.com"
    webhookSecret: ${STRIPE_WEBHOOK_SECRET}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: alpha
    tags-sorter: alpha